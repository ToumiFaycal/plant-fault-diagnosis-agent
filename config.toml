# Project settings, in one place. Scripts read their numbers from here,
# so every part of the project uses the same run numbers.

[data]
raw_dir = "data/raw"              # the four downloaded .RData files
processed_dir = "data/processed"  # the Parquet files made by convert_data
first_faulty_sample_training = 21   # faults start 1 hour into training runs (checked in the data)
first_faulty_sample_testing = 161   # and 8 hours into testing runs (dev and test)
episodes_dir = "data/episodes"      # what each investigation is allowed to see (labels never go here)
monitor_file = "data/monitor/monitor.npz"  # what the monitor learned, saved once, so the server needn't fit it
docs_index_file = "data/docs/index.npz"     # the meaning of each knowledge section, computed once (python -m plantagent.docsearch)

# Which recorded runs are used for what. Each range includes both ends.
[splits]
# Training runs (25 hours each)
monitor_fit_runs = { first = 1, last = 100 }            # normal runs that teach the monitor what "normal" looks like
monitor_calibration_runs = { first = 101, last = 150 }  # normal runs that set the monitor's alarm limits
baseline_runs = { first = 1, last = 50 }                # runs of every fault (and normal) for the baseline classifier

# Testing runs (48 hours each)
dev_normal_runs = { first = 1, last = 10 }    # normal runs we develop and debug on
dev_fault_runs = { first = 1, last = 5 }      # runs of each fault we develop and debug on
test_pool_runs = { first = 201, last = 250 }  # kept apart for the final exam (the runs converted from the raw files)
# The final exam, chosen on 2026-11-12 before anything was run on it: the same shape as the development
# episodes (110), about 3 hours for one pass of the agent at about 100 seconds per episode.
test_normal_runs = { first = 201, last = 210 }
test_fault_runs = { first = 201, last = 205 }

# The monitor (the plant's smoke detector).
[monitor]
share_of_variation_to_keep = 0.90  # keep enough normal patterns to explain 90 % of normal variation
alarm_percentile = 99              # alarm limit: only 1 % of healthy moments score above it
alarm_after_consecutive = 3        # raise the alarm only after this many moments in a row above a limit

# Episodes: each development or test run becomes one investigation for the agent.
[episodes]
seed = 2026                       # fixes the random episode names and operator report times (development)
test_seed = 2027                  # the same for the test episodes (a different seed, so names never repeat)
investigate_after_minutes = 60    # "now" is this long after the first alarm, or after the operator's report
operator_report_after_hours = { first = 1, last = 6 }  # no alarm: an operator reports 1 to 6 hours after 8:00

# Baseline B2: a classifier that learns to name faults from labelled training runs (no tools, no reasoning).
[baseline]
window_minutes = 60        # it looks at the last hour of the plant: 20 moments
window_every_minutes = 30  # from each training run, one 1-hour window every 30 minutes
trees = 100                # how many decision trees vote
min_examples_per_leaf = 5  # each final answer in a tree must rest on at least 5 examples (keeps trees small)
seed = 0                   # fixes the random parts of training, so it gives the same model every time

# The language model, run on this computer by Ollama.
[llm]
model = "qwen3:8b"
num_ctx = 16384   # how much conversation (in tokens) the model can see at once; always set it ourselves
temperature = 0   # 0 = always pick the most likely next word, so answers repeat from run to run
seed = 42         # fixes the randomness that remains
think = false     # Qwen3's slower "thinking mode"; whether it helps is measured later

# The agent: Qwen3 investigating one episode through the plant-historian tools.
[agent]
max_steps = 12                  # most rounds of "the model asks, the tools answer" before it must write its report
trace_dir = "results/traces"    # one file per episode: every model call and tool call, with times and tokens
# A first trial on 5 development episodes (python -m plantagent.agent --trial): run 1 of the first
# fault of each grading group and of the normal runs, plus the first episode we ran.
trial_episodes = ["ep_da12f9aa", "ep_2a699431", "ep_da9277da", "ep_d9c06aa9", "ep_f6f8d79c"]

# Searching the plant's reference documents (knowledge/) by meaning.
[docs]
embedding_model = "embeddinggemma"  # turns a text into 768 numbers that capture its meaning (run by Ollama)
results = 3      # at most this many sections per search
cutoff = 0.35    # sections less similar than this are left out (chosen from 18 hand-written test questions)
