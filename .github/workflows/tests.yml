# Runs the project's tests on a fresh computer at GitHub, after every push.
name: tests

on: push

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get a copy of the code
        uses: actions/checkout@v7

      - name: Install Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the project and its libraries
        run: python -m pip install -e .

      - name: Run the tests
        run: python -m pytest -v
